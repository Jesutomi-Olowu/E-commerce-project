version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Copy your Amplify environment variables into a file the running site can read
        - env | grep -E '^(AUTH_|APP_|USERS_|PRODUCTS_|ORDERS_|IMAGES_|FILES_|PAYSTACK_|PLATFORM_)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
